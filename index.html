<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#E8458B">
  <title>Mon Plan 10km</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E8458B'/><text x='50' y='58' text-anchor='middle' font-size='42' font-weight='800' fill='white' font-family='sans-serif'>10K</text></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <p class="greeting-line"><span id="greeting">Bonjour</span> <strong>Inès</strong></p>
        <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4140/4140047.png" alt="Avatar">
      </div>
    </div>
  </header>

  <main class="container">

    <div class="race-banner">
      <img src="banner.png" alt="10km Côte de Granit Rose" class="banner-img">
      <div class="banner-overlay">
        <div class="banner-info">
          <p class="banner-race">10km Côte de Granit Rose</p>
          <p class="banner-date">Dimanche 26 juillet 2026</p>
        </div>
        <div class="countdown-badge">
          <span class="countdown-number" id="countdown">0</span>
          <span class="countdown-label">jours</span>
        </div>
      </div>
    </div>

    <div class="objective-bar">
      <span class="objective-icon">🎯</span>
      <span>Objectif : <strong>47 min</strong> · 100 m D+ · allure 4:42/km</span>
    </div>

    <div class="motivation" id="motivation"></div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Ta progression</span>
        <span class="progress-count"><span id="progress-count">0</span>/18</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="segment-control">
      <button class="segment-btn active" data-tab="today">Aujourd'hui</button>
      <button class="segment-btn" data-tab="programme">Programme</button>
    </div>

    <div id="tab-today" class="tab-content active"></div>

    <div id="tab-programme" class="tab-content">
      <div class="week-picker" id="week-picker"></div>
      <div id="week-sessions"></div>
    </div>

  </main>

  <script>
    const PLAN = [
      {"id":1,"label":"Semaine 1","theme":"Reprise","dates":"16 – 21 juin","sessions":[
        {"id":"w1s1","day":"Mar","type":"f","title":"Sortie facile","dur":"~45 min","dist":"~7 km","pace":"6:00 – 6:20 /km","desc":"Commence par 15 min très faciles pour t'échauffer, puis allure confortable (conversation possible), et termine par 5 min de retour au calme."},
        {"id":"w1s2","day":"Jeu","type":"q","title":"Fractionné 6×500m","dur":"~50 min","dist":"~7,5 km","pace":"Rép : 4:40 /km · Récup : trot 90s","desc":"15 min d'échauffement → 6×500m réguliers → 5 min de retour au calme. Cherche la régularité, ne pars pas trop vite."},
        {"id":"w1s3","day":"Sam","type":"l","title":"Sortie longue","dur":"~55 min","dist":"~8,5 km","pace":"6:10 – 6:30 /km","desc":"15 min d'échauffement très facile, puis allure facile et régulière, 5 min de retour au calme. Hydrate-toi avant de partir."}
      ]},
      {"id":2,"label":"Semaine 2","theme":"Construction","dates":"23 – 28 juin","sessions":[
        {"id":"w2s1","day":"Mar","type":"f","title":"Sortie facile","dur":"~50 min","dist":"~8 km","pace":"5:55 – 6:15 /km","desc":"15 min d'échauffement, puis allure confortable un poil plus soutenue que S1, et 5 min de retour au calme."},
        {"id":"w2s2","day":"Jeu","type":"q","title":"Côtes 8×45s","dur":"~50 min","dist":"~7,5 km","pace":"Montées : effort soutenu · Récup : descente en trot/marche","desc":"Spécifique Granit Rose (100 m D+). 15 min d'échauffement → 8×45s en côte (pente 4-6 %), pousse sur les bras → descente en récup → 5 min de retour au calme."},
        {"id":"w2s3","day":"Sam","type":"l","title":"Sortie longue","dur":"~60 min","dist":"~9,5 km","pace":"6:05 – 6:25 /km","desc":"15 min d'échauffement facile, puis sortie régulière sur terrain vallonné si possible, et 5 min de retour au calme."}
      ]},
      {"id":3,"label":"Semaine 3","theme":"Développement","dates":"30 juin – 5 juillet","sessions":[
        {"id":"w3s1","day":"Mar","type":"f","title":"Sortie facile","dur":"~50 min","dist":"~8 km","pace":"5:55 – 6:10 /km","desc":"15 min d'échauffement, allure facile et fluide, concentre-toi sur la régularité de la foulée, puis 5 min de retour au calme."},
        {"id":"w3s2","day":"Jeu","type":"q","title":"Tempo 25 min","dur":"~55 min","dist":"~8,5 km","pace":"Tempo : 5:15 /km · Écha/retour : 6:10 /km","desc":"15 min d'échauffement → 25 min à allure tempo (soutenu mais contrôlé, tu peux dire quelques mots) → 5 min de retour au calme."},
        {"id":"w3s3","day":"Sam","type":"l","title":"Sortie longue","dur":"~65 min","dist":"~10 km","pace":"6:00 – 6:20 /km","desc":"15 min d'échauffement facile, puis tu couvres la distance de la course à allure facile, et 5 min de retour au calme."}
      ]},
      {"id":4,"label":"Semaine 4","theme":"Spécifique côtes","dates":"7 – 12 juillet","sessions":[
        {"id":"w4s1","day":"Mar","type":"f","title":"Sortie facile","dur":"~50 min","dist":"~8 km","pace":"5:55 – 6:10 /km","desc":"15 min d'échauffement, allure facile pour absorber la charge, puis 5 min de retour au calme."},
        {"id":"w4s2","day":"Jeu","type":"q","title":"Côtes 10×45s + 4×200m","dur":"~55 min","dist":"~8 km","pace":"Montées : soutenu · 200m : 4:30 /km","desc":"Séance clé dénivelé. 15 min d'échauffement → 10×45s en côte (récup descente) → 4×200m vifs sur le plat → 5 min de retour au calme."},
        {"id":"w4s3","day":"Sam","type":"l","title":"Sortie longue + allure course","dur":"~65 min","dist":"~10,5 km","pace":"45 min facile (6:05) + 15 min allure course (4:45)","desc":"15 min d'échauffement, 45 min faciles, puis 15 min à allure course pour habituer les jambes, et 5 min de retour au calme. Première simulation partielle."}
      ]},
      {"id":5,"label":"Semaine 5","theme":"Affûtage","dates":"14 – 19 juillet","sessions":[
        {"id":"w5s1","day":"Mar","type":"f","title":"Sortie facile","dur":"~45 min","dist":"~7 km","pace":"6:00 – 6:15 /km","desc":"15 min d'échauffement, allure facile, on commence à réduire le volume — les sensations vont s'affûter. 5 min de retour au calme."},
        {"id":"w5s2","day":"Jeu","type":"q","title":"5×1000m — séance clé","dur":"~60 min","dist":"~9 km","pace":"Rép : 4:40 /km · Récup : trot 2 min","desc":"15 min d'échauffement → 5×1000m à allure objectif → 5 min de retour au calme. La séance qualité la plus exigeante du plan, dernière grosse séance avant le taper."},
        {"id":"w5s3","day":"Sam","type":"l","title":"Sortie longue + allure course","dur":"~55 min","dist":"~8,5 km","pace":"35 min facile (6:05) + 15 min allure course (4:45)","desc":"15 min d'échauffement, 35 min faciles, puis 15 min à allure course, et 5 min de retour au calme. Dernière vraie sortie longue."}
      ]},
      {"id":6,"label":"Semaine course","theme":"26 juillet — Côte de Granit Rose","dates":"21 – 26 juillet","race":true,"sessions":[
        {"id":"w6s1","day":"Mar","type":"f","title":"Activation","dur":"~40 min","dist":"~6 km","pace":"6:10 – 6:30 /km + 4×100m","desc":"15 min d'échauffement très facile → 4×100m vifs pour réveiller les jambes → 5 min de retour au calme. On allège, le corps se recharge."},
        {"id":"w6s2","day":"Ven","type":"f","title":"Déverrouillage","dur":"~30 min","dist":"~5 km","pace":"6:20 – 6:45 /km","desc":"Sortie courte et très facile (volontairement légère, 2 jours avant la course) : 15 min très tranquilles + 2-3 accélérations légères + 5 min de retour au calme. Prépare ton dossard et ton kit."},
        {"id":"w6s3","day":"Dim","type":"r","title":"COURSE — 10km Côte de Granit Rose","dur":"Objectif 47 min","dist":"10 km · 100 m D+","pace":"Objectif : 4:40 – 4:45 /km","desc":"Départ contrôlé les 2 premiers km (~4:50/km). Gère les montées à l'effort sans exploser, relance dans les descentes pour récupérer du temps. Tout donner sur la fin. Bonne course !"}
      ]}
    ];
  </script>
  <script src="app.js"></script>
</body>
</html>
