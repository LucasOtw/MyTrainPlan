<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#E8458B">
  <title>Mon Plan 10km</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E8458B'/><text x='50' y='58' text-anchor='middle' font-size='42' font-weight='800' fill='white' font-family='sans-serif'>10K</text></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <p class="greeting-line"><span id="greeting">Bonjour</span> <strong>Inès</strong></p>
        <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4140/4140047.png" alt="Avatar">
      </div>
    </div>
  </header>

  <main class="container">

    <div class="race-banner">
      <img src="banner.png" alt="Adidas 10K Paris" class="banner-img">
      <div class="banner-overlay">
        <div class="banner-info">
          <p class="banner-race">Adidas 10km Paris</p>
          <p class="banner-date">Dimanche 7 juin 2026</p>
        </div>
        <div class="countdown-badge">
          <span class="countdown-number" id="countdown">0</span>
          <span class="countdown-label">jours</span>
        </div>
      </div>
    </div>

    <div class="objective-bar">
      <span class="objective-icon">🎯</span>
      <span>Objectif : <strong>47 min</strong> · allure 4:42/km</span>
    </div>

    <div class="motivation" id="motivation"></div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Ta progression</span>
        <span class="progress-count"><span id="progress-count">0</span>/27</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="segment-control">
      <button class="segment-btn active" data-tab="today">Aujourd'hui</button>
      <button class="segment-btn" data-tab="programme">Programme</button>
    </div>

    <div id="tab-today" class="tab-content active"></div>

    <div id="tab-programme" class="tab-content">
      <div class="week-picker" id="week-picker"></div>
      <div id="week-sessions"></div>
    </div>

  </main>

  <script>
    const PLAN = [
      {"id":1,"label":"Semaine 1","theme":"Mise en route","dates":"7 – 13 avril","sessions":[
        {"id":"w1s1","day":"Mar","type":"f","title":"Sortie facile","dur":"30 min","dist":"~4,5 km","pace":"6:10 – 6:30 /km","desc":"Course continue à allure confortable. Tu dois pouvoir tenir une conversation sans être essoufflé."},
        {"id":"w1s2","day":"Jeu","type":"q","title":"Fractionné 6×400m","dur":"~35 min","dist":"~5 km","pace":"Rép : 4:40 /km · Récup : trot 90s","desc":"10 min d'échauffement → 6×400m réguliers → 5 min retour au calme. Cherche la régularité."},
        {"id":"w1s3","day":"Sam","type":"l","title":"Sortie longue","dur":"45 min","dist":"~7 km","pace":"6:20 – 6:40 /km","desc":"Allure très facile du début à la fin. Hydrate-toi avant de partir."}
      ]},
      {"id":2,"label":"Semaine 2","theme":"Construction","dates":"14 – 20 avril","sessions":[
        {"id":"w2s1","day":"Mar","type":"f","title":"Sortie facile","dur":"35 min","dist":"~5,5 km","pace":"6:00 – 6:20 /km","desc":"Légèrement plus rapide que S1. Allure toujours confortable, conversation possible."},
        {"id":"w2s2","day":"Jeu","type":"q","title":"Tempo 20 min","dur":"~35 min","dist":"~6 km","pace":"Tempo : 5:20 /km · Écha/retour : 6:15 /km","desc":"10 min échauffement → 20 min à allure tempo (effort soutenu mais contrôlé) → 5 min retour calme."},
        {"id":"w2s3","day":"Sam","type":"l","title":"Sortie longue","dur":"50 min","dist":"~8 km","pace":"6:15 – 6:30 /km","desc":"50 min à allure facile. Prends un encas 1h avant si besoin."}
      ]},
      {"id":3,"label":"Semaine 3","theme":"Construction","dates":"21 – 27 avril","sessions":[
        {"id":"w3s1","day":"Mar","type":"f","title":"Sortie facile","dur":"35 min","dist":"~5,5 km","pace":"5:55 – 6:15 /km","desc":"Allure facile, concentre-toi sur la régularité de la foulée."},
        {"id":"w3s2","day":"Jeu","type":"q","title":"Fractionné 8×400m","dur":"~40 min","dist":"~6 km","pace":"Rép : 4:35 /km · Récup : trot 90s","desc":"Volume +33% vs S1. Échauffement 10 min → 8×400m → retour calme 5 min."},
        {"id":"w3s3","day":"Sam","type":"l","title":"Sortie longue","dur":"55 min","dist":"~9 km","pace":"6:10 – 6:25 /km","desc":"55 min à allure facile. Tu approches la distance de la course."}
      ]},
      {"id":4,"label":"Semaine 4","theme":"Récupération active","dates":"28 avr – 4 mai","sessions":[
        {"id":"w4s1","day":"Mar","type":"f","title":"Sortie facile","dur":"30 min","dist":"~4,5 km","pace":"6:15 – 6:30 /km","desc":"Semaine allégée. Profite-en pour récupérer, corps et mental."},
        {"id":"w4s2","day":"Jeu","type":"q","title":"Fractionné 5×400m","dur":"~30 min","dist":"~4,5 km","pace":"Rép : 4:40 /km · Récup : trot 90s","desc":"Volume réduit mais maintien de l'intensité. Séance courte et propre."},
        {"id":"w4s3","day":"Sam","type":"l","title":"Sortie longue allégée","dur":"45 min","dist":"~7 km","pace":"6:20 – 6:35 /km","desc":"Volume réduit cette semaine. On repart fort dès S5."}
      ]},
      {"id":5,"label":"Semaine 5","theme":"Développement","dates":"5 – 11 mai","sessions":[
        {"id":"w5s1","day":"Mar","type":"f","title":"Sortie facile","dur":"40 min","dist":"~6,5 km","pace":"5:55 – 6:10 /km","desc":"Les semaines de récup paient — tu devrais te sentir frais."},
        {"id":"w5s2","day":"Jeu","type":"q","title":"4×1000m","dur":"~45 min","dist":"~7 km","pace":"Rép : 4:45 /km · Récup : trot 2 min","desc":"Répétitions plus longues — gère ton effort sur 1000m. Écha 10 min → 4×1000m → retour calme 10 min."},
        {"id":"w5s3","day":"Sam","type":"l","title":"Sortie longue 60 min","dur":"60 min","dist":"~10 km","pace":"6:00 – 6:15 /km","desc":"Première sortie à 60 min — tu couvres la distance de la course ! Allure très facile."}
      ]},
      {"id":6,"label":"Semaine 6","theme":"Développement","dates":"12 – 18 mai","sessions":[
        {"id":"w6s1","day":"Mar","type":"f","title":"Sortie facile","dur":"40 min","dist":"~6,5 km","pace":"5:50 – 6:05 /km","desc":"Si tu te sens bien, tu peux aller un peu plus vite naturellement."},
        {"id":"w6s2","day":"Jeu","type":"q","title":"Tempo 25 min + 4×200m","dur":"~50 min","dist":"~8 km","pace":"Tempo : 5:15 /km · 200m : 4:30 /km","desc":"Séance clé. Écha 10 min → 25 min tempo → récup 3 min → 4×200m vifs avec 90s récup → retour calme."},
        {"id":"w6s3","day":"Sam","type":"l","title":"Sortie longue 65 min","dur":"65 min","dist":"~10,5 km","pace":"50 min facile (6:10) + 15 min allure course (5:00)","desc":"65 min : les 50 premières faciles, les 15 dernières à allure course. Première simulation partielle."}
      ]},
      {"id":7,"label":"Semaine 7","theme":"Affûtage","dates":"19 – 25 mai","sessions":[
        {"id":"w7s1","day":"Mar","type":"f","title":"Sortie facile","dur":"35 min","dist":"~5,5 km","pace":"6:00 – 6:15 /km","desc":"On commence à réduire le volume. Les sensations vont s'affûter."},
        {"id":"w7s2","day":"Jeu","type":"q","title":"5×1000m — séance clé","dur":"~50 min","dist":"~8 km","pace":"Rép : 4:40 /km · Récup : trot 2 min","desc":"La séance qualité la plus intense du plan. Dernière grande séance avant taper."},
        {"id":"w7s3","day":"Sam","type":"l","title":"Sortie longue 55 min","dur":"55 min","dist":"~9 km","pace":"35 min facile (6:10) + 20 min allure course (5:00)","desc":"55 min : les 35 premières faciles, les 20 dernières à allure course. Dernière vraie sortie longue."}
      ]},
      {"id":8,"label":"Semaine 8","theme":"Taper","dates":"26 mai – 1er juin","sessions":[
        {"id":"w8s1","day":"Mar","type":"f","title":"Sortie facile","dur":"30 min","dist":"~5 km","pace":"6:10 – 6:25 /km","desc":"Volume réduit. Les jambes se rechargent. Ne cherche pas à compenser par de l'intensité."},
        {"id":"w8s2","day":"Jeu","type":"q","title":"4×400m allure course + 6×100m","dur":"~30 min","dist":"~4 km","pace":"400m : 5:00 /km · 100m : sprint vif","desc":"Activation : écha 10 min → 4×400m à allure course → 6×100m vifs → retour calme."},
        {"id":"w8s3","day":"Sam","type":"f","title":"Sortie très facile","dur":"20 min","dist":"~3 km","pace":"6:30 – 7:00 /km","desc":"Très courte sortie de récup. Rien à forcer, juste s'activer."}
      ]},
      {"id":9,"label":"Semaine course","theme":"7 juin — Adidas 10km","dates":"2 – 7 juin","race":true,"sessions":[
        {"id":"w9s1","day":"Mar","type":"f","title":"Activation légère","dur":"20 min","dist":"~3 km","pace":"6:20 – 6:40 /km + 4×100m","desc":"20 min de trot facile + 4×100m vifs à la fin. Le corps se met en veille."},
        {"id":"w9s2","day":"Ven","type":"f","title":"Sortie ultra-légère","dur":"15 min","dist":"~2 km","pace":"6:30 – 7:00 /km","desc":"15 min de trot très léger. Prépare ton dossard et ton kit."},
        {"id":"w9s3","day":"Dim","type":"r","title":"COURSE — Adidas 10km","dur":"Objectif 47 min","dist":"10 km","pace":"Objectif : 4:40 – 4:42 /km","desc":"Départ contrôlé les 2 premiers km (4:45/km). Régulier de km 2 à 8. Tout donner sur les 2 derniers. Bonne course !"}
      ]}
    ];
  </script>
  <script src="app.js"></script>
</body>
</html>
